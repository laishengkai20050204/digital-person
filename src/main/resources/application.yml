spring:
  application:
    name: digital-person
  mvc:
    async:
      request-timeout: ${SPRING_MVC_ASYNC_REQUEST_TIMEOUT:210s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

digital-person:
  persistence:
    mysql:
      enabled: ${MYSQL_PERSISTENCE_ENABLED:false}
      jdbc-url: ${MYSQL_JDBC_URL:}
      username: ${MYSQL_USERNAME:}
      password: ${MYSQL_PASSWORD:}
      maximum-pool-size: ${MYSQL_MAXIMUM_POOL_SIZE:10}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT:30s}
      conversation:
        retention-turns: ${CONVERSATION_RETENTION_TURNS:500}
        episode-enabled: ${CONVERSATION_EPISODE_ENABLED:true}
        episode-max-items: ${CONVERSATION_EPISODE_MAX_ITEMS:3}
  person-api:
    enabled: ${PERSON_API_ENABLED:false}
    token: ${PERSON_API_TOKEN:}
  dialogue:
    max-memory-items: ${DIALOGUE_MAX_MEMORY_ITEMS:8}
    max-conversation-turns: ${DIALOGUE_MAX_CONVERSATION_TURNS:12}
    max-output-tokens: ${DIALOGUE_MAX_OUTPUT_TOKENS:1200}
    temperature: ${DIALOGUE_TEMPERATURE:0.7}
    conversation-summary-enabled: ${CONVERSATION_SUMMARY_ENABLED:true}
    conversation-summary-batch-turns: ${CONVERSATION_SUMMARY_BATCH_TURNS:8}
    conversation-summary-max-output-tokens: ${CONVERSATION_SUMMARY_MAX_OUTPUT_TOKENS:800}
    conversation-summary-temperature: ${CONVERSATION_SUMMARY_TEMPERATURE:0.2}
    conversation-episode-enabled: ${CONVERSATION_EPISODE_ENABLED:true}
    conversation-episode-max-output-tokens: ${CONVERSATION_EPISODE_MAX_OUTPUT_TOKENS:2048}
    conversation-episode-temperature: ${CONVERSATION_EPISODE_TEMPERATURE:0.1}
  activity-scheduler:
    enabled: ${ACTIVITY_SCHEDULER_ENABLED:false}
    poll-interval: ${ACTIVITY_SCHEDULER_POLL_INTERVAL:10s}
    initial-delay: ${ACTIVITY_SCHEDULER_INITIAL_DELAY:30s}
    reconciliation-interval: ${ACTIVITY_SCHEDULER_RECONCILIATION_INTERVAL:1h}
    reconciliation-initial-delay: ${ACTIVITY_SCHEDULER_RECONCILIATION_INITIAL_DELAY:5s}
    initial-review-delay: ${ACTIVITY_SCHEDULER_INITIAL_REVIEW_DELAY:1m}
    minimum-review-delay: ${ACTIVITY_SCHEDULER_MINIMUM_REVIEW_DELAY:1m}
    conflict-retry-delay: ${ACTIVITY_SCHEDULER_CONFLICT_RETRY_DELAY:30s}
    lease-duration: ${ACTIVITY_SCHEDULER_LEASE_DURATION:10m}
    lease-renewal-interval: ${ACTIVITY_SCHEDULER_LEASE_RENEWAL_INTERVAL:2m}
    decision-timeout: ${ACTIVITY_SCHEDULER_DECISION_TIMEOUT:8m}
    failure-backoff: ${ACTIVITY_SCHEDULER_FAILURE_BACKOFF:5m}
    max-failure-backoff: ${ACTIVITY_SCHEDULER_MAX_FAILURE_BACKOFF:1h}
    batch-size: ${ACTIVITY_SCHEDULER_BATCH_SIZE:10}
    max-in-flight: ${ACTIVITY_SCHEDULER_MAX_IN_FLIGHT:4}
  memory:
    structured:
      enabled: ${STRUCTURED_MEMORY_ENABLED:false}
      minimum-entity-similarity: ${STRUCTURED_MEMORY_MINIMUM_ENTITY_SIMILARITY:0.60}
      maximum-entity-candidates: ${STRUCTURED_MEMORY_MAXIMUM_ENTITY_CANDIDATES:300}
    extraction:
      enabled: ${STRUCTURED_MEMORY_EXTRACTION_ENABLED:false}
      recent-turns-to-keep: ${STRUCTURED_MEMORY_EXTRACTION_RECENT_TURNS_TO_KEEP:2}
      batch-turns: ${STRUCTURED_MEMORY_EXTRACTION_BATCH_TURNS:8}
      maximum-entities: ${STRUCTURED_MEMORY_EXTRACTION_MAXIMUM_ENTITIES:8}
      maximum-facts: ${STRUCTURED_MEMORY_EXTRACTION_MAXIMUM_FACTS:12}
      minimum-confidence: ${STRUCTURED_MEMORY_EXTRACTION_MINIMUM_CONFIDENCE:0.70}
      minimum-importance: ${STRUCTURED_MEMORY_EXTRACTION_MINIMUM_IMPORTANCE:0.35}
      max-output-tokens: ${STRUCTURED_MEMORY_EXTRACTION_MAX_OUTPUT_TOKENS:4096}
      temperature: ${STRUCTURED_MEMORY_EXTRACTION_TEMPERATURE:0.1}
    mem0:
      enabled: ${MEM0_ENABLED:false}
      required: ${MEM0_REQUIRED:false}
      retrieval-enabled: ${MEM0_RETRIEVAL_ENABLED:false}
      minimum-relevance: ${MEM0_MINIMUM_RELEVANCE:0.30}
      extraction-instructions: "${MEM0_EXTRACTION_INSTRUCTIONS:}"
      base-url: ${MEM0_BASE_URL:http://127.0.0.1:8888}
      api-key: ${MEM0_API_KEY:}
      connect-timeout: ${MEM0_CONNECT_TIMEOUT:2s}
      request-timeout: ${MEM0_REQUEST_TIMEOUT:30s}
      recording-timeout: ${MEM0_RECORDING_TIMEOUT:120s}
      deduplication-enabled: ${MEM0_DEDUPLICATION_ENABLED:true}
      duplicate-semantic-threshold: ${MEM0_DUPLICATE_SEMANTIC_THRESHOLD:0.62}
      duplicate-text-threshold: ${MEM0_DUPLICATE_TEXT_THRESHOLD:0.30}
      duplicate-max-candidates: ${MEM0_DUPLICATE_MAX_CANDIDATES:5}
      max-response-bytes: ${MEM0_MAX_RESPONSE_BYTES:1048576}
      health-path: ${MEM0_HEALTH_PATH:/auth/setup-status}
    test-api:
      enabled: ${MEMORY_TEST_API_ENABLED:false}
      token: ${MEMORY_TEST_API_TOKEN:}
  diagnostics:
    enabled: ${DIAGNOSTICS_ENABLED:false}
    token: ${DIAGNOSTICS_TOKEN:}
  llm:
    enabled: ${LLM_ENABLED:false}
    base-url: ${LLM_BASE_URL:https://openrouter.ai/api/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    timeout: ${LLM_TIMEOUT:60s}
    max-retries: ${LLM_MAX_RETRIES:2}
    concurrency:
      maximum: ${LLM_CONCURRENCY_MAXIMUM:4}
      acquire-timeout: ${LLM_CONCURRENCY_ACQUIRE_TIMEOUT:2s}
    connection-test:
      enabled: ${LLM_CONNECTION_TEST_ENABLED:false}
      token: ${LLM_CONNECTION_TEST_TOKEN:}
