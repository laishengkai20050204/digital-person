# One-time verifier for the structured-memory batch.
name: Apply structured memory batch 4

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/structured-memory-hybrid-retrieval
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Apply structured memory patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/batch4.part00 \
              .github/batch4.part01.s00 \
              .github/batch4.part01.s01 \
              .github/batch4.part01.s02 \
              .github/batch4.part01.s03 \
              .github/batch4.part01.s04 \
              .github/batch4.part01.s05 \
              .github/batch4.part02 \
              .github/batch4.part03 \
              > /tmp/batch4.patch.gz.b64
          base64 --decode /tmp/batch4.patch.gz.b64 \
              | gzip --decompress \
              > /tmp/batch4.patch
          echo "a550b80d7d5b522d2db3c22074b5f296ae28124b29a68a83e433cd0df28c2ced  /tmp/batch4.patch" \
              | sha256sum --check --strict
          git apply --index /tmp/batch4.patch
          rm -f .github/batch4.part00 \
                .github/batch4.part01 \
                .github/batch4.part01.s00 \
                .github/batch4.part01.s01 \
                .github/batch4.part01.s02 \
                .github/batch4.part01.s03 \
                .github/batch4.part01.s04 \
                .github/batch4.part01.s05 \
                .github/batch4.part02 \
                .github/batch4.part03 \
                .github/workflows/apply-structured-memory-batch4.yml
          chmod +x mvnw

      - name: Verify structured memory
        shell: bash
        run: |
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee batch4-maven.log

      - name: Upload verification failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: structured-memory-batch4-verify-log
          path: batch4-maven.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit verified structured memory
        shell: bash
        run: |
          set -euo pipefail
          rm -f batch4-maven.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add structured memory and hybrid retrieval"
          git push origin HEAD:agent/structured-memory-hybrid-retrieval
