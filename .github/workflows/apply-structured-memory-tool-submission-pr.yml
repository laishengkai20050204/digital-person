name: Apply structured-memory tool patch on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Extract, verify, and apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-structured-memory-tool-submission.yml').read_text()
          payload = source.split("<<'PATCH_B64'\n", 1)[1].split('\nPATCH_B64\n', 1)[0]
          Path('/tmp/structured-memory-tool-submission.patch.gz.b64').write_text(payload)
          PY
          echo '58901339eabaed5395fd2f8b745343bcacd8262554b4839f1f5ec0764b9d51f4  /tmp/structured-memory-tool-submission.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/structured-memory-tool-submission.patch.gz.b64 | gzip --decompress > /tmp/structured-memory-tool-submission.patch
          echo '60d0316182f06652fe081196ee6c35c42faaed8b1df815055c8c941afb5a4c1e  /tmp/structured-memory-tool-submission.patch' | sha256sum -c -
          git apply --check /tmp/structured-memory-tool-submission.patch
          git apply /tmp/structured-memory-tool-submission.patch

      - name: Run full Maven verification
        id: verify
        continue-on-error: true
        shell: bash
        run: ./mvnw -B verify > /tmp/maven-verify.log 2>&1

      - name: Upload Maven verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-memory-tool-maven-verify
          path: /tmp/maven-verify.log
          if-no-files-found: error

      - name: Fail on Maven verification error
        if: steps.verify.outcome == 'failure'
        shell: bash
        run: |
          tail -n 200 /tmp/maven-verify.log
          exit 1

      - name: Commit verified implementation
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-structured-memory-tool-submission.yml
          rm .github/workflows/apply-structured-memory-tool-submission-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use required tool for structured memory extraction'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
