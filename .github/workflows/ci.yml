name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate deployment scripts and OpenClaw bridge
        run: |
          bash -n ops/deploy-from-git.sh
          bash -n ops/ensure-mem0.sh
          bash -n ops/test-ensure-mem0-secret-handling.sh
          bash -n scripts/install-openclaw-direct-bridge.sh
          bash -n ops/purchased_1m_bronze_remote.sh
          bash -n ops/purchased_1m_remote_task.sh
          bash -n ops/purchased_1m_bronze_ci_task.sh
          python3 -m py_compile ops/purchased_1m_bronze.py
          node --check openclaw-plugins/digital-person-direct-bridge/index.mjs
          python3 -m json.tool \
            openclaw-plugins/digital-person-direct-bridge/package.json \
            >/dev/null
          python3 -m json.tool \
            openclaw-plugins/digital-person-direct-bridge/openclaw.plugin.json \
            >/dev/null

      - name: Verify Mem0 secret handling
        run: bash ops/test-ensure-mem0-secret-handling.sh

      - name: Verify
        run: set -o pipefail; ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee maven.log

      - name: Upload Maven failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-failure-log
          path: maven.log
          retention-days: 7
