name: Apply runtime boundary patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Decode and check patch
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .github/runtime-fix.patch.gz > /tmp/runtime-fix.patch
          test "$(sha256sum /tmp/runtime-fix.patch | cut -d' ' -f1)" = "dfae8dc761025274b31f9aa3be8367b824fdaaaf0a13e5073d9a155e5f9922df"
          git apply --check --verbose /tmp/runtime-fix.patch
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          gzip -dc .github/runtime-fix.patch.gz > /tmp/runtime-fix.patch
          git apply --verbose /tmp/runtime-fix.patch
      - name: Commit final files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/runtime-fix.patch.gz
          rm -f .github/workflows/apply-runtime-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix dialogue runtime boundaries"
      - name: Push final commit
        shell: bash
        run: git push origin HEAD:${{ github.head_ref }}
