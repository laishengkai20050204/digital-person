name: Apply structured-memory tool submission patch

on:
  push:
    branches:
      - agent/structured-memory-tool-submission
    paths:
      - .github/workflows/apply-structured-memory-tool-submission.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/structured-memory-tool-submission.patch.gz.b64 <<'PATCH_B64'

PATCH_B64
          echo '58901339eabaed5395fd2f8b745343bcacd8262554b4839f1f5ec0764b9d51f4  /tmp/structured-memory-tool-submission.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/structured-memory-tool-submission.patch.gz.b64 | gzip --decompress > /tmp/structured-memory-tool-submission.patch
          echo '60d0316182f06652fe081196ee6c35c42faaed8b1df815055c8c941afb5a4c1e  /tmp/structured-memory-tool-submission.patch' | sha256sum -c -
          git apply --check /tmp/structured-memory-tool-submission.patch
          git apply /tmp/structured-memory-tool-submission.patch

      - name: Run full Maven verification
        run: ./mvnw -B verify

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-structured-memory-tool-submission.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use required tool for structured memory extraction'
          git push
