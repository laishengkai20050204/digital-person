name: Apply runtime fixes

on:
  push:
    branches:
      - agent/fix-dialogue-runtime-boundaries

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-dialogue-runtime-boundaries
          fetch-depth: 0

      - name: Apply staged patches and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          for patch in .github/patches/runtime-fixes-*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          git rm .github/patches/runtime-fixes-*.patch
          git rm .github/workflows/apply-runtime-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix dialogue runtime boundaries"
          git push origin HEAD:agent/fix-dialogue-runtime-boundaries
