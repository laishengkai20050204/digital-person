name: Apply automatic structured memory extraction patch

on:
  push:
    branches:
      - agent/automatic-structured-memory-extraction
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: automatic-structured-memory-extraction-patch
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/automatic-structured-memory-extraction
          fetch-depth: 1
          show-progress: false
          persist-credentials: true

      - name: Reassemble, diagnose and validate patch
        id: patch
        shell: bash
        run: |
          set -euxo pipefail
          test -f .github/auto-extract-payload/READY
          wc -c \
            .github/auto-extract-payload/chunks/part-000 \
            .github/auto-extract-payload/chunks/part-001 \
            .github/auto-extract-payload/chunks/fix-002-0 \
            .github/auto-extract-payload/chunks/fix-002-1 \
            .github/auto-extract-payload/chunks/part-003 \
            .github/auto-extract-payload/chunks/part-004
          cat \
            .github/auto-extract-payload/chunks/part-000 \
            .github/auto-extract-payload/chunks/part-001 \
            .github/auto-extract-payload/chunks/fix-002-0 \
            .github/auto-extract-payload/chunks/fix-002-1 \
            .github/auto-extract-payload/chunks/part-003 \
            .github/auto-extract-payload/chunks/part-004 \
            > /tmp/payload.b64
          wc -c /tmp/payload.b64
          sha256sum /tmp/payload.b64
          echo 'db4e82c3d8b77f0e9508374a5b810026b530a964347b9c196619162e98f911c3  /tmp/payload.b64' | sha256sum -c -
          base64 --decode /tmp/payload.b64 | gzip --decompress > /tmp/change.patch
          wc -c /tmp/change.patch
          sha256sum /tmp/change.patch
          echo '73b2c6f01105c71e1e4fd350f114ec68c352104335e9bbcde1eb689015891c31  /tmp/change.patch' | sha256sum -c -
          git apply --check /tmp/change.patch
          git apply /tmp/change.patch
          git diff --check

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify implementation
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Commit formal implementation and remove temporary payload
        shell: bash
        run: |
          rm -rf .github/auto-extract-payload
          rm -f .github/workflows/apply-auto-extraction-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add automatic structured memory extraction'
          git push origin HEAD:agent/automatic-structured-memory-extraction
