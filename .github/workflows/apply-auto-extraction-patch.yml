name: Apply automatic structured memory extraction patch

on:
  push:
    branches:
      - agent/automatic-structured-memory-extraction
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: automatic-structured-memory-extraction-patch
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/automatic-structured-memory-extraction
          fetch-depth: 0
          persist-credentials: true

      - name: Stop until payload is complete
        id: readiness
        shell: bash
        run: |
          if [[ -f .github/auto-extract-payload/READY ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Payload is still being staged.'
          fi

      - name: Set up Java 21
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Reassemble and validate patch
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          cat .github/auto-extract-payload/chunks/part-* > /tmp/payload.b64
          echo 'db4e82c3d8b77f0e9508374a5b810026b530a964347b9c196619162e98f911c3  /tmp/payload.b64' | sha256sum -c -
          base64 --decode /tmp/payload.b64 | gzip --decompress > /tmp/change.patch
          echo '73b2c6f01105c71e1e4fd350f114ec68c352104335e9bbcde1eb689015891c31  /tmp/change.patch' | sha256sum -c -
          git apply --check /tmp/change.patch
          git apply /tmp/change.patch
          git diff --check

      - name: Verify implementation
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Commit formal implementation and remove temporary payload
        if: steps.readiness.outputs.ready == 'true'
        shell: bash
        run: |
          rm -rf .github/auto-extract-payload
          rm -f .github/workflows/apply-auto-extraction-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add automatic structured memory extraction'
          git push origin HEAD:agent/automatic-structured-memory-extraction
