name: Apply engineering hardening

on:
  push:
    branches:
      - agent/engineering-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/engineering-hardening
          fetch-depth: 0

      - name: Apply and verify engineering hardening
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/batch2.patch.gz.b64 | gzip --decompress > /tmp/batch2.patch
          git apply --index /tmp/batch2.patch
          rm -f .github/batch2.patch.gz.b64
          rm -f .github/workflows/apply-engineering-hardening.yml
          bash -n mvnw
          bash -n ops/deploy-from-git.sh
          ./mvnw --batch-mode --no-transfer-progress verify
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add engineering quality gates and HTTP safeguards"
          git push origin HEAD:agent/engineering-hardening
