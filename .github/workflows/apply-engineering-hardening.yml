name: Apply engineering hardening

on:
  push:
    branches:
      - agent/engineering-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-engineering-hardening
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/engineering-hardening
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply engineering hardening
        shell: bash
        run: |
          set -euo pipefail
          cat .github/batch2.patch.gz.b64.?? | base64 --decode | gzip --decompress > /tmp/batch2.patch
          git apply --index /tmp/batch2.patch
          bash -n mvnw
          bash -n ops/deploy-from-git.sh

      - name: Verify engineering hardening
        shell: bash
        run: |
          set -o pipefail
          ./mvnw --batch-mode --no-transfer-progress verify 2>&1 | tee /tmp/engineering-hardening-verify.log

      - name: Upload verification failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-hardening-verify-log
          path: /tmp/engineering-hardening-verify.log
          if-no-files-found: warn

      - name: Commit verified engineering hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add engineering quality gates and HTTP safeguards"
          git push origin HEAD:agent/engineering-hardening
